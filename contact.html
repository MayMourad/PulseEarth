<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - PulseEarth</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
    <div class="container mx-auto px-6 py-10">
        <h1 class="text-4xl font-bold mb-6">Contact Us</h1>
        <p class="mb-4">If you have any questions, comments, or concerns, please feel free to reach out to us using the contact form below.</p>
        <form action="#" method="POST" class="bg-white p-6 rounded-lg shadow-md">
            <div class="mb-4">
                <label for="name" class="block text-gray-700">Name</label>
                <input type="text" id="name" name="name" required class="border border-gray-300 p-2 w-full rounded">
            </div>
            <div class="mb-4">
                <label for="email" class="block text-gray-700">Email</label>
                <input type="email" id="email" name="email" required class="border border-gray-300 p-2 w-full rounded">
            </div>
            <div class="mb-4">
                <label for="message" class="block text-gray-700">Message</label>
                <textarea id="message" name="message" rows="4" required class="border border-gray-300 p-2 w-full rounded"></textarea>
            </div>
            <button type="submit" class="bg-eco-green text-white px-4 py-2 rounded hover:bg-green-700">Send Message</button>
        </form>
    </div>
</body>
</html>
